{% extends 'base.html' %}
{% block title %}Broadcast Global Notice{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
    <!-- Header Block -->
    <div class="bg-slate-900 p-6 text-white">
        <span class="px-2.5 py-1 rounded bg-amber-500/20 text-amber-400 font-semibold text-xs tracking-wider uppercase border border-amber-500/30">System Announcement</span>
        <h1 class="text-2xl font-black mt-2 tracking-tight">Create Global Notice</h1>
        <p class="text-slate-400 text-sm mt-1">This message will be broadcast instantly to the noticeboards of <strong>all students and parents</strong>.</p>
    </div>

    <!-- Interactive Form -->
    <form method="post" class="p-6 space-y-5">
        {% csrf_token %}
        
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">Notice Title</label>
            <input type="text" name="title" placeholder="e.g., Annual Sports Day & General Holiday Notice" required 
                   class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:outline-none transition">
        </div>

        <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">Notice Content Message</label>
            <textarea name="content" rows="6" placeholder="Type the complete details of your institutional announcement here..." required 
                      class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:outline-none transition resize-vertical"></textarea>
        </div>

        <div class="pt-4 border-t border-gray-100 flex items-center justify-end space-x-3">
            <a href="{% url 'admin_dashboard' %}" class="px-4 py-2.5 rounded-lg border border-gray-200 bg-white text-gray-700 font-bold text-sm hover:bg-gray-50 transition">
                Cancel
            </a>
            <button type="submit" class="px-6 py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-bold text-sm rounded-lg shadow-sm transition">
                🚀 Publish Global Broadcast
            </button>
        </div>
    </form>
</div>
{% endblock %}
